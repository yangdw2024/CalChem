[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calchem-qc"
version = "0.2.0"
description = "Unified quantum chemistry workstation: native engine + Gaussian/ORCA/PySCF adapters"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "CalChem Team", email = "calchem@trae.ai" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["quantum chemistry", "DFT", "GPU", "OPV", "GROMACS", "CalChem"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
external = [
    "cclib>=1.6",
]
pyscf = [
    "pyscf>=2.5",
]
md = [
    "MDAnalysis>=2.5",
    "mendeleev>=0.15",
]
symmetry = [
    "spglib>=2.2",
]
gpu = [
    "cupy-cuda12x>=13.0",
]
gui = [
    "PyQt6>=6.5",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.6",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]
all = ["calchem[external,pyscf,md,symmetry,gui,dev,docs]"]

[project.scripts]
calchem = "calchem.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["calchem*"]

[tool.setuptools.package-data]
calchem = ["basis/*.dat", "data/*.yaml", "data/*.json", "_core.pyd", "_core.pyi", "_core.so", "_core.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
norecursedirs = ["tests/debug", "tests/scratch", "calchem/tests", "docs", "build", "dist"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: requires GPU (deselect with '-m \"not gpu\"')",
    "regression: regression tests against Gaussian reference",
    "external: requires external programs (Gaussian/ORCA/xTB)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["tests/"]

[tool.maturin]
manifest-path = "crates/calchem-py/Cargo.toml"
module-name = "calchem._core"
python-source = "."
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
