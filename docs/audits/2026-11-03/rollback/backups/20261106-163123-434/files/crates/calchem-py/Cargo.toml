[package]
name = "calchem-py"
version = "0.2.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
calchem-model = { path = "../calchem-model" }
calchem-basis = { path = "../calchem-basis" }
calchem-tensor = { path = "../calchem-tensor" }
calchem-int = { path = "../calchem-int" }
calchem-scf = { path = "../calchem-scf" }
calchem-grad = { path = "../calchem-grad" }
calchem-opt = { path = "../calchem-opt" }
calchem-prop = { path = "../calchem-prop" }
calchem-dft = { path = "../calchem-dft" }
calchem-tddft = { path = "../calchem-tddft" }
calchem-vib = { path = "../calchem-vib" }
pyo3 = { workspace = true }
numpy = { workspace = true }
