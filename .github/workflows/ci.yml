name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  rust-workspace:
    name: Rust Workspace Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      RAYON_NUM_THREADS: 4
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Cargo Tests
        run: cargo test --workspace --no-fail-fast --jobs 4
      - name: Build Native Release CLI
        run: cargo build --release -p calchem-cli --jobs 4
